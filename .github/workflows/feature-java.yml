name: Java Feature Workflow

on:
  workflow_call:

jobs:
  build:
    name: 🚀 Java Feature Build
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout Code
        uses: actions/checkout@v4

      - name: 📥 Export YAML entries as Env Vars
        uses: 4h5y87ffq8-byte/demo-reusable-workflows/.github/action/export-yaml-env@main
        with:
          file: .a5x_devops
          root_prefix: .a5x_devops

      - name: 💾 Cache Maven Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: ☕ Set up JDK ${{ env.a5x_devops__build__stack_version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.a5x_devops__build__stack_version }}

      - name: 🏗️ Build & Test
        working-directory: ${{ env.a5x_devops__build__working_directory }}
        run: |
          mvn --batch-mode clean verify \
            -Dcheckstyle.skip=true \
            -Dpmd.skip=true \
            -Dspotbugs.skip=true \
            -T 1C \
            -DskipITs

      - name: 📊 Code Quality Report
        if: success()
        continue-on-error: true
        working-directory: ${{ env.a5x_devops__build__working_directory }}
        run: |
          echo "Running code quality checks..."
          mvn checkstyle:check pmd:check -Dcheckstyle.failOnViolation=false -Dpmd.failOnViolation=false || true
          
          echo "### 📊 Code Quality Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f target/checkstyle-result.xml ]; then
            violations=$(grep -c "<error" target/checkstyle-result.xml 2>/dev/null || echo "0")
            echo "- **Checkstyle:** $violations violations" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ -f target/pmd.xml ]; then
            violations=$(grep -c "<violation" target/pmd.xml 2>/dev/null || echo "0")
            echo "- **PMD:** $violations issues" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "💡 Quality issues will be enforced on merge to develop" >> $GITHUB_STEP_SUMMARY

      - name: 🔒 Security Scan (Non-blocking)
        if: success()
        continue-on-error: true
        working-directory: ${{ env.a5x_devops__build__working_directory }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          echo "Running OWASP security check (warnings only)..."
          
          # Tentar com autoUpdate se falhar sem
          mvn org.owasp:dependency-check-maven:9.0.9:check \
            -DfailBuildOnCVSS=7 \
            -DautoUpdate=true \
            -Dformats=HTML,JSON \
            -DoutputDirectory=target/dependency-check 2>&1 || echo "⚠️ OWASP completed with warnings"
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 Security Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f target/dependency-check/dependency-check-report.json ]; then
            vulnerabilities=$(jq '.dependencies[].vulnerabilities[]?' target/dependency-check/dependency-check-report.json 2>/dev/null | grep -c "name" || echo "0")
            echo "- **OWASP:** $vulnerabilities vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            
            if [ "$vulnerabilities" -gt "0" ]; then
              critical=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity=="CRITICAL")] | length' target/dependency-check/dependency-check-report.json 2>/dev/null || echo "0")
              high=$(jq '[.dependencies[].vulnerabilities[]? | select(.severity=="HIGH")] | length' target/dependency-check/dependency-check-report.json 2>/dev/null || echo "0")
              echo "  - Critical: $critical" >> $GITHUB_STEP_SUMMARY
              echo "  - High: $high" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **OWASP:** ⚠️ Check skipped or failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔐 Security vulnerabilities will block merge to develop" >> $GITHUB_STEP_SUMMARY

  auto-pr:
    needs: build
    uses: 4h5y87ffq8-byte/demo-reusable-workflows/.github/workflows/feature-auto-pr-to-develop.yml@main
    secrets: inherit
