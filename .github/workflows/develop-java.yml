name: 🚧 Java Develop Workflow

on:
  workflow_call:

jobs:
  build-tests:
    name: 🏗️ Build, Tests & Publish
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📥 Export YAML entries as env vars
        uses: 4h5y87ffq8-byte/demo-reusable-workflows/.github/action/export-yaml-env@main
        with:
          file: .a5x_devops
          root_prefix: .a5x_devops

      - name: 💾 Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: ☕ Set up JDK ${{ env.a5x_devops__build__stack_version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.a5x_devops__build__stack_version }}

      - name: 🏗️ Build, Test & Quality Checks
        working-directory: ${{ env.a5x_devops__build__working_directory }}
        run: |
          echo "🔒 Modo STRICT: Quality checks bloquearão o build"
          mvn --batch-mode clean verify \
            checkstyle:check \
            pmd:check \
            -Dcheckstyle.failOnViolation=false \
            -Dpmd.failOnViolation=false \
            -T 1C \
            -Dmaven.test.failure.ignore=false \
            -DskipITs
          
          # OWASP Dependency Check
          mvn org.owasp:dependency-check-maven:9.0.9:check \
            -DfailBuildOnCVSS=7 \
            -DautoUpdate=false \
            -Dformats=HTML,JSON \
            -DoutputDirectory=target/dependency-check

      - name: 📤 Publish to Nexus
        working-directory: ${{ env.a5x_devops__build__working_directory }}
        run: mvn deploy -DskipTests
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  publish-deploy:
    name: 🚀 Build Docker & Deploy
    needs: build-tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📥 Export YAML entries as env vars
        uses: 4h5y87ffq8-byte/demo-reusable-workflows/.github/action/export-yaml-env@main
        with:
          file: .a5x_devops
          root_prefix: .a5x_devops

      - name: 🔐 AWS Authentication ECR
        id: aws-auth-ecr
        uses: 4h5y87ffq8-byte/demo-reusable-workflows/.github/action/aws-auth-ecr@main
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.a5x_devops__deploy__dev__region }}
          account-id: ${{ env.a5x_devops__deploy__dev__account_id }}

      - name: 🏗️ Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ☕ Set up JDK ${{ env.a5x_devops__build__stack_version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.a5x_devops__build__stack_version }}

      - name: 📝 Extract version from pom.xml
        id: version
        working-directory: ${{ env.a5x_devops__build__working_directory }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short_sha=${GITHUB_SHA:0:8}" >> $GITHUB_OUTPUT

      - name: 🐳 Build & Push Docker Image
        uses: 4h5y87ffq8-byte/demo-reusable-workflows/.github/action/docker-build-push@main
        with:
          working-directory: ${{ env.a5x_devops__build__working_directory }}
          image-name: ${{ env.a5x_devops__deploy__image_name }}
          repository: ${{ env.a5x_devops__deploy__repository }}
          registry: ${{ steps.aws-auth-ecr.outputs.registry }}
          tag: ${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}
          platforms: ${{ env.a5x_devops__deploy__platform }}

      - name: 🎯 Force ECS Service Update
        run: |
          echo "Forcing new deployment for ECS service..."
          aws ecs update-service \
            --cluster ${{ env.a5x_devops__deploy__ecs__cluster_name }} \
            --service ${{ env.a5x_devops__deploy__ecs__service_name }} \
            --force-new-deployment \
            --region ${{ env.a5x_devops__deploy__dev__region }}

      - name: ⏳ Wait for Service Stability
        run: |
          echo "Waiting for service to stabilize..."
          aws ecs wait services-stable \
            --cluster ${{ env.a5x_devops__deploy__ecs__cluster_name }} \
            --services ${{ env.a5x_devops__deploy__ecs__service_name }} \
            --region ${{ env.a5x_devops__deploy__dev__region }}

      - name: 📊 Deployment Summary
        run: |
          echo "### 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ steps.version.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** ${{ steps.aws-auth-ecr.outputs.registry }}/${{ env.a5x_devops__deploy__repository }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.short_sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Cluster:** ${{ env.a5x_devops__deploy__ecs__cluster_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ env.a5x_devops__deploy__ecs__service_name }}" >> $GITHUB_STEP_SUMMARY
