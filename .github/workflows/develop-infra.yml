name: 🏗️ Infrastructure Provision Workflow

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (dev, cer, prd)"
        required: true
        type: string
      action:
        description: "Terraform action (plan, apply, destroy)"
        required: false
        type: string
        default: "plan"

jobs:
  terraform:
    name: 🏗️ Terraform ${{ inputs.action }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Necessário para OIDC
      contents: read
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📥 Export YAML entries as env vars
        uses: 4h5y87ffq8-byte/demo-reusable-workflows/.github/action/export-yaml-env@main
        with:
          file: .a5x_devops
          root_prefix: .a5x_devops

      - name: 🔐 AWS Authentication (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env[format('a5x_devops__deploy__{0}__account_id', inputs.environment)] }}:role/GitHubActionsRole
          role-session-name: terraform-${{ inputs.environment }}-${{ github.run_id }}
          aws-region: ${{ env[format('a5x_devops__deploy__{0}__region', inputs.environment)] }}

      - name: 🪣 Validate/Create S3 Backend Bucket
        run: |
          BUCKET_NAME="${{ env.a5x_devops__deploy__terraform__backend_bucket }}"
          REGION="${{ env.a5x_devops__deploy__terraform__backend_region }}"

          echo "Checking if bucket $BUCKET_NAME exists..."

          if aws s3api head-bucket --bucket "$BUCKET_NAME" 2>/dev/null; then
            echo "✅ Bucket $BUCKET_NAME already exists"
          else
            echo "📦 Creating bucket $BUCKET_NAME in region $REGION..."
            
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket \
                --bucket "$BUCKET_NAME" \
                --region "$REGION"
            else
              aws s3api create-bucket \
                --bucket "$BUCKET_NAME" \
                --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            
            echo "🔒 Enabling versioning on bucket..."
            aws s3api put-bucket-versioning \
              --bucket "$BUCKET_NAME" \
              --versioning-configuration Status=Enabled
            
            echo "🔐 Enabling encryption on bucket..."
            aws s3api put-bucket-encryption \
              --bucket "$BUCKET_NAME" \
              --server-side-encryption-configuration '{
                "Rules": [{
                  "ApplyServerSideEncryptionByDefault": {
                    "SSEAlgorithm": "AES256"
                  },
                  "BucketKeyEnabled": true
                }]
              }'
            
            echo "🚫 Blocking public access..."
            aws s3api put-public-access-block \
              --bucket "$BUCKET_NAME" \
              --public-access-block-configuration \
                BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            
            echo "✅ Bucket $BUCKET_NAME created and configured successfully"
          fi

      - name: 🗃️ Create DynamoDB Lock Table (if not exists)
        run: |
          TABLE_NAME="${{ env.a5x_devops__deploy__terraform__backend_bucket }}-lock"
          REGION="${{ env.a5x_devops__deploy__terraform__backend_region }}"

          echo "Checking if DynamoDB table $TABLE_NAME exists..."

          if aws dynamodb describe-table --table-name "$TABLE_NAME" --region "$REGION" 2>/dev/null; then
            echo "✅ DynamoDB table $TABLE_NAME already exists"
          else
            echo "📋 Creating DynamoDB table $TABLE_NAME for state locking..."
            aws dynamodb create-table \
              --table-name "$TABLE_NAME" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST \
              --region "$REGION" \
              --tags Key=Purpose,Value=TerraformStateLock Key=ManagedBy,Value=GitHub-Actions
            
            echo "⏳ Waiting for table to be active..."
            aws dynamodb wait table-exists --table-name "$TABLE_NAME" --region "$REGION"
            
            echo "✅ DynamoDB table $TABLE_NAME created successfully"
          fi

      - name: 🔧 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.a5x_devops__deploy__terraform__version }}

      - name: 📝 Create Terraform Backend Config
        working-directory: ${{ env.a5x_devops__deploy__terraform__working_directory }}
        run: |
          cat > backend-${{ inputs.environment }}.tfbackend <<EOF
          bucket         = "${{ env.a5x_devops__deploy__terraform__backend_bucket }}"
          key            = "${{ env.a5x_devops__deploy__terraform__backend_key_prefix }}/${{ inputs.environment }}/terraform.tfstate"
          region         = "${{ env.a5x_devops__deploy__terraform__backend_region }}"
          dynamodb_table = "${{ env.a5x_devops__deploy__terraform__backend_bucket }}-lock"
          encrypt        = true
          EOF

          echo "Backend configuration:"
          cat backend-${{ inputs.environment }}.tfbackend

      - name: 🔧 Terraform Init
        working-directory: ${{ env.a5x_devops__deploy__terraform__working_directory }}
        run: |
          terraform init \
            -backend-config=backend-${{ inputs.environment }}.tfbackend \
            -reconfigure

      - name: ✅ Terraform Validate
        working-directory: ${{ env.a5x_devops__deploy__terraform__working_directory }}
        run: terraform validate

      - name: 📋 Terraform Plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: ${{ env.a5x_devops__deploy__terraform__working_directory }}
        env:
          TF_VAR_environment: ${{ env[format('a5x_devops__deploy__{0}__environment', inputs.environment)] }}
          TF_VAR_aws_region: ${{ env[format('a5x_devops__deploy__{0}__region', inputs.environment)] }}
          TF_VAR_vpc_id: ${{ env[format('a5x_devops__deploy__{0}__vpc_id', inputs.environment)] }}
          TF_VAR_private_subnet_ids: ${{ env[format('a5x_devops__deploy__{0}__private_subnet_ids', inputs.environment)] }}
          TF_VAR_desired_count: ${{ env[format('a5x_devops__deploy__{0}__desired_count', inputs.environment)] }}
          TF_VAR_cluster_name: ${{ env.a5x_devops__deploy__ecs__cluster_name }}
          TF_VAR_service_name: ${{ env.a5x_devops__deploy__ecs__service_name }}
          TF_VAR_container_name: ${{ env.a5x_devops__deploy__ecs__container_name }}
          TF_VAR_container_image: "placeholder:latest"
          TF_VAR_container_port: ${{ env.a5x_devops__deploy__ecs__port }}
          TF_VAR_task_cpu: ${{ env.a5x_devops__deploy__ecs__cpu }}
          TF_VAR_task_memory: ${{ env.a5x_devops__deploy__ecs__memory }}
          TF_VAR_log_retention_days: ${{ env.a5x_devops__deploy__ecs__log_retention_days }}
          TF_VAR_ecr_repository_name: ${{ env.a5x_devops__deploy__repository }}
        run: terraform plan -out=tfplan-${{ inputs.environment }}

      - name: 💾 Upload Plan Artifact
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}
          path: ${{ env.a5x_devops__deploy__terraform__working_directory }}/tfplan-${{ inputs.environment }}
          retention-days: 5

      - name: 🚀 Terraform Apply
        if: inputs.action == 'apply'
        working-directory: ${{ env.a5x_devops__deploy__terraform__working_directory }}
        run: terraform apply -auto-approve tfplan-${{ inputs.environment }}

      - name: 💥 Terraform Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.a5x_devops__deploy__terraform__working_directory }}
        env:
          TF_VAR_environment: ${{ env[format('a5x_devops__deploy__{0}__environment', inputs.environment)] }}
          TF_VAR_aws_region: ${{ env[format('a5x_devops__deploy__{0}__region', inputs.environment)] }}
          TF_VAR_vpc_id: ${{ env[format('a5x_devops__deploy__{0}__vpc_id', inputs.environment)] }}
          TF_VAR_private_subnet_ids: ${{ env[format('a5x_devops__deploy__{0}__private_subnet_ids', inputs.environment)] }}
          TF_VAR_desired_count: ${{ env[format('a5x_devops__deploy__{0}__desired_count', inputs.environment)] }}
          TF_VAR_cluster_name: ${{ env.a5x_devops__deploy__ecs__cluster_name }}
          TF_VAR_service_name: ${{ env.a5x_devops__deploy__ecs__service_name }}
          TF_VAR_container_name: ${{ env.a5x_devops__deploy__ecs__container_name }}
          TF_VAR_container_image: "placeholder:latest"
          TF_VAR_container_port: ${{ env.a5x_devops__deploy__ecs__port }}
          TF_VAR_task_cpu: ${{ env.a5x_devops__deploy__ecs__cpu }}
          TF_VAR_task_memory: ${{ env.a5x_devops__deploy__ecs__memory }}
          TF_VAR_log_retention_days: ${{ env.a5x_devops__deploy__ecs__log_retention_days }}
          TF_VAR_ecr_repository_name: ${{ env.a5x_devops__deploy__repository }}
        run: |
          ALLOW_DESTROY="${{ env[format('a5x_devops__deploy__{0}__destroy', inputs.environment)] }}"

          if [ "$ALLOW_DESTROY" != "true" ]; then
            echo "❌ Destroy is not allowed for environment: ${{ inputs.environment }}"
            echo "To enable destroy, set 'destroy: true' in .a5x_devops for this environment"
            exit 1
          fi

          echo "⚠️ Destroying infrastructure for environment: ${{ inputs.environment }}"
          echo "⚠️ This action is irreversible!"

          terraform destroy -auto-approve

      - name: 📊 Terraform Output
        if: inputs.action == 'apply'
        working-directory: ${{ env.a5x_devops__deploy__terraform__working_directory }}
        run: terraform output -json > terraform-output-${{ inputs.environment }}.json

      - name: 💾 Upload Outputs
        if: inputs.action == 'apply'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-output-${{ inputs.environment }}
          path: ${{ env.a5x_devops__deploy__terraform__working_directory }}/terraform-output-${{ inputs.environment }}.json

      - name: 📊 Summary
        run: |
          echo "### 🏗️ Terraform ${{ inputs.action }} Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env[format('a5x_devops__deploy__{0}__region', inputs.environment)] }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Account ID:** ${{ env[format('a5x_devops__deploy__{0}__account_id', inputs.environment)] }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Action:** ${{ inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Backend Bucket:** ${{ env.a5x_devops__deploy__terraform__backend_bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **State Key:** ${{ env.a5x_devops__deploy__terraform__backend_key_prefix }}/${{ inputs.environment }}/terraform.tfstate" >> $GITHUB_STEP_SUMMARY
          echo "- **Destroy Allowed:** ${{ env[format('a5x_devops__deploy__{0}__destroy', inputs.environment)] }}" >> $GITHUB_STEP_SUMMARY
          if [ "${{ inputs.action }}" = "destroy" ]; then
            echo "- **Destroy Allowed:** ${{ env[format('a5x_devops__deploy__{0}__destroy', inputs.environment)] }}" >> $GITHUB_STEP_SUMMARY
          fi
