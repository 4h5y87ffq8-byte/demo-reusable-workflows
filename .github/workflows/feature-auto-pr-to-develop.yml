name: 🚀 Auto PR to Develop

on:
  workflow_call:
    inputs:
      commit_message_prefix:
        description: 'Prefixo para a mensagem de commit (ex: feat, fix, chore)'
        required: false
        type: string
        default: 'feat'
      quality_summary:
        description: 'Quality summary from build job'
        required: false
        type: string
        default: ''
    secrets:
      TOKEN:
        description: "GitHub token for creating pull requests"
        required: true

jobs:
  create-pr-to-develop:
    name: 🔀 Create PR to Develop
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 🔀 Create Pull Request to Develop
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          # Extrair o nome da branch e determinar o prefixo automaticamente
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Determinar prefixo baseado no padrão da branch
          if [[ "$BRANCH_NAME" == feature/* ]]; then
            COMMIT_PREFIX="feat"
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/^feature\///')
          elif [[ "$BRANCH_NAME" == fix/* ]] || [[ "$BRANCH_NAME" == bugfix/* ]]; then
            COMMIT_PREFIX="fix"
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/^fix\///' | sed 's/^bugfix\///')
          elif [[ "$BRANCH_NAME" == hotfix/* ]]; then
            COMMIT_PREFIX="fix"
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/^hotfix\///')
          elif [[ "$BRANCH_NAME" == chore/* ]]; then
            COMMIT_PREFIX="chore"
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/^chore\///')
          elif [[ "$BRANCH_NAME" == docs/* ]]; then
            COMMIT_PREFIX="docs"
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/^docs\///')
          elif [[ "$BRANCH_NAME" == refactor/* ]]; then
            COMMIT_PREFIX="refactor"
            CLEAN_BRANCH=$(echo "$BRANCH_NAME" | sed 's/^refactor\///')
          else
            COMMIT_PREFIX="${{ inputs.commit_message_prefix }}"
            CLEAN_BRANCH="$BRANCH_NAME"
          fi
          
          # Mensagem de commit customizada
          COMMIT_TITLE="$COMMIT_PREFIX: $CLEAN_BRANCH"
          COMMIT_BODY="Merged from branch: $BRANCH_NAME

          Build #${{ github.run_number }}
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}
          Author: @${{ github.actor }}"
          
          # Template do PR (centralizado no workflow)
          PR_TEMPLATE=$(cat << EOF
          ## 📝 Resumo
          
          PR automático criado após build bem-sucedido da branch \`${{ github.ref_name }}\`.
          
          ## 🔄 Informações do Build
          
          - **📅 Data/Hora:** $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S %Z')
          - **📦 Build:** #${{ github.run_number }}
          - **🔗 Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **📝 Commit:** \`${{ github.sha }}\`
          - **👤 Autor:** @${{ github.actor }}
          
          ${{ inputs.quality_summary }}
          
          ## ✅ Checklist
          
          - [x] Build passou com sucesso
          - [x] Testes executados
          - [ ] Code review necessário
          - [ ] Aprovação para merge
          
          ---
          
          **⚠️ Atenção:** Este PR foi gerado automaticamente. Revise as mudanças antes de fazer merge.
          
          ## 📋 Mensagem de Commit Sugerida
          
          **Título:** \`$COMMIT_TITLE\`
          
          **Descrição:**
          \`\`\`
          $COMMIT_BODY
          \`\`\`
          EOF
          )
          
          echo "🔍 Verificando se já existe PR da branch '${{ github.ref_name }}' para 'develop'..."
          
          # Verificar se já existe um PR aberto ESPECIFICAMENTE da branch atual para develop
          # --head filtra pela branch de origem (source branch)
          # ✅ Branches diferentes = PRs diferentes (comportamento correto)
          # ✅ Mesma branch com novos commits = atualiza o PR existente
          existing_pr=$(gh pr list --head "${{ github.ref_name }}" --base develop --state open --json number --jq '.[0].number' || echo "")

          if [ -n "$existing_pr" ]; then
            echo "♻️ PR já existe para esta branch: #$existing_pr"
            echo "📝 Atualizando PR existente com informações do novo commit..."
            
            # Atualizar título e body do PR existente com informações atualizadas
            echo "$PR_TEMPLATE" | gh pr edit $existing_pr \
              --title "$COMMIT_TITLE" \
              --body-file -
            
            # Adicionar comentário incremental ao PR
            gh pr comment $existing_pr \
              --body "## 🔄 Atualização Automática

            Novo build concluído com sucesso!

            **📅 Data/Hora:** $(TZ=America/Sao_Paulo date '+%Y-%m-%d %H:%M:%S %Z')
            **📦 Build:** #${{ github.run_number }}
            **🔗 Workflow:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            **📝 Commit:** \`${{ github.sha }}\`
            
            ---
            _Comentário gerado automaticamente pelo workflow_"
            
            echo "✅ PR #$existing_pr atualizado com sucesso!"
            echo "📌 URL: ${{ github.server_url }}/${{ github.repository }}/pull/$existing_pr"
          else
            echo "🆕 Nenhum PR encontrado para a branch '${{ github.ref_name }}'"
            echo "📝 Criando novo PR para 'develop'..."
            
            # Criar novo PR com template e reviewers
            pr_url=$(echo "$PR_TEMPLATE" | gh pr create \
              --base develop \
              --head ${{ github.ref_name }} \
              --title "$COMMIT_TITLE" \
              --body-file - \
              --assignee @me \
              --reviewer 4h5y87ffq8-byte/github-repository-admin-team)
            
            pr_number=$(echo "$pr_url" | grep -oP '\d+$')
            echo "✅ Novo PR criado com sucesso!"
            echo "📌 URL: $pr_url"
            echo "🔢 Número: #$pr_number"
            
            # Adicionar comentário mencionando os revisores
            gh pr comment $pr_number \
              --body "## 👥 Revisores Necessários

            Este PR requer aprovação de:
            - @4h5y87ffq8-byte/github-repository-admin-team (obrigatório)

            **⚠️ Importante:** Este PR foi gerado automaticamente após build bem-sucedido.
            
            Por favor, revise as mudanças antes de aprovar."
          fi
