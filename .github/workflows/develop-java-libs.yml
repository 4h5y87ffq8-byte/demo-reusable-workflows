name: 🚧 Java Library Develop Workflow

on:
  workflow_call:

jobs:
  build-tests:
    name: 🏗️ Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📥 Export YAML entries as env vars
        uses: 4h5y87ffq8-byte/demo-reusable-workflows/.github/action/export-yaml-env@main
        with:
          file: .a5x_devops
          root_prefix: .a5x_devops

      - name: 💾 Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: ☕ Set up JDK ${{ env.a5x_devops__build__stack_version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.a5x_devops__build__stack_version }}

      - name: 🏗️ Build with Maven
        working-directory: ${{ env.a5x_devops__build__working_directory }}
        run: mvn clean install

      - name: 🧪 Run Unit Tests
        working-directory: ${{ env.a5x_devops__build__working_directory }}
        run: mvn test

  publish-nexus:
    name: 📦 Publish to Nexus
    needs: build-tests
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v4

      - name: 📥 Export YAML entries as env vars
        uses: 4h5y87ffq8-byte/demo-reusable-workflows/.github/action/export-yaml-env@main
        with:
          file: .a5x_devops
          root_prefix: .a5x_devops

      - name: ☕ Set up JDK ${{ env.a5x_devops__build__stack_version }}
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: ${{ env.a5x_devops__build__stack_version }}

      - name: 📤 Publish to Nexus
        working-directory: ${{ env.a5x_devops__build__working_directory }}
        run: mvn deploy -DskipTests
        env:
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
