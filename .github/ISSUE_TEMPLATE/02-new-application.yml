name: 🏗️ Novo Repositório - Aplicação
description: Criar repositório para aplicação (API, Frontend, Backend, etc)
title: "[NEW APP] - ${{inputs.repo_name}} - ${{inputs.stack}} - ${{inputs.deployment_target}}"
labels: ["new-repository", "automation", "application"]

body:
  - type: markdown
    attributes:
      value: |
        ## 🎯 Solicitação de Novo Repositório - Aplicação
        
        Preencha os campos abaixo para gerar automaticamente um repositório de aplicação com as configurações desejadas.

        ---

        **Nome do Repositório:** informe exclusivamente o nome do sistema_modulo.
        **Exemplo:** para o repositório final "a5x-app-pos-anteros-receiver-financial", informe apenas "anteros-receiver-financial".
        
        ---

        **⚠️ Importante:** Após submeter esta issue, o repositório será criado automaticamente em até 5 minutos.

  - type: input
    id: repo_name
    attributes:
      label: Nome do Repositório
      description: Nome do repositório a ser criado (sem espaços, use hífens). O nome final é composto por a5x-app-<dominio>-<repo_name>
      placeholder: ex. anteros-receiver-financial
    validations:
      required: true

  - type: input
    id: repo_description
    attributes:
      label: Descrição
      description: Breve descrição do repositório
      placeholder: ex. API REST para gerenciamento de usuários
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domínio da Aplicação
      description: Qual domínio da aplicação será gerenciado?
      options:
        - CRX - Cross
        - DAT - Dados
        - POS - Post Trading
        - TRD - Trading
    validations:
      required: true

  - type: dropdown
    id: stack
    attributes:
      label: Stack Tecnológica
      description: Qual stack/linguagem será utilizada?
      options:
        - Java 17
        - Node.js 24.12.0
    validations:
      required: true

  - type: dropdown
    id: deployment_target
    attributes:
      label: Ambiente de Deploy
      description: Onde a aplicação será deployada?
      options:
        - AWS ECS (Container)
        - AWS EKS (Kubernetes)
        - AWS Lambda (Serverless)
        - On Premise
    validations:
      required: true

  - type: dropdown
    id: visibility
    attributes:
      label: Visibilidade do Repositório
      description: O repositório será interno ou privado?
      options:
        - Private
        - Internal
      default: 0
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmação
      description: Ao submeter, você confirma que
      options:
        - label: Li e concordo com as políticas de criação de repositórios
          required: true
