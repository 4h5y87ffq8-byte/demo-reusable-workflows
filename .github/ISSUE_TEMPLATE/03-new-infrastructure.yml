name: 🏗️ Novo Repositório - Infraestrutura
description: Criar repositório para infraestrutura (Terraform, IaC, etc)
title: "[NEW INFRA] - "
labels: ["new-repository", "automation", "infrastructure"]

body:
  - type: markdown
    attributes:
      value: |
        ## 🎯 Solicitação de Novo Repositório - Infraestrutura
        
        Preencha os campos abaixo para gerar automaticamente um repositório de infraestrutura com as configurações desejadas.
        
        **⚠️ Importante:** Após submeter esta issue, o repositório será criado automaticamente em até 5 minutos.

  - type: input
    id: repo_name
    attributes:
      label: Nome do Repositório
      description: Nome do repositório a ser criado (sem espaços, use hífens)
      placeholder: ex. infra-producao-eks
    validations:
      required: true

  - type: input
    id: repo_description
    attributes:
      label: Descrição
      description: Breve descrição do repositório
      placeholder: ex. Infraestrutura Terraform para cluster EKS de produção
    validations:
      required: true

  - type: dropdown
    id: infra_type
    attributes:
      label: Tipo de Infraestrutura
      description: Qual tipo de infraestrutura será gerenciada?
      options:
        - Terraform (AWS)
        - Terraform (Azure)
        - Terraform (GCP)
        - Terraform (Multi-Cloud)
        - CloudFormation (AWS)
        - Ansible
        - Kubernetes Manifests
        - Helm Charts
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Ambiente
      description: Para qual ambiente é a infraestrutura?
      options:
        - Multi-ambiente (dev/stg/prd)
        - Produção
        - Staging
        - Desenvolvimento
    validations:
      required: true

  - type: checkboxes
    id: resources
    attributes:
      label: Recursos de Infraestrutura
      description: Selecione os recursos que serão gerenciados
      options:
        - label: Networking (VPC, Subnets, Route Tables)
          required: false
        - label: Compute (EC2, ECS, EKS, Lambda)
          required: false
        - label: Database (RDS, DynamoDB, ElastiCache)
          required: false
        - label: Storage (S3, EFS, EBS)
          required: false
        - label: Load Balancers (ALB, NLB)
          required: false
        - label: Security (IAM, Security Groups, KMS)
          required: false
        - label: Monitoring (CloudWatch, Alarms)
          required: false
        - label: DNS (Route53)
          required: false

  - type: checkboxes
    id: features
    attributes:
      label: Features Adicionais
      description: Selecione as features que deseja incluir
      options:
        - label: GitHub Actions para Terraform Plan/Apply
          required: false
        - label: Pre-commit Hooks (tflint, terraform fmt)
          required: false
        - label: Terraform Backend S3 configurado
          required: false
        - label: Módulos Terraform reutilizáveis
          required: false
        - label: Documentação automática (terraform-docs)
          required: false
        - label: Cost estimation (Infracost)
          required: false

  - type: dropdown
    id: visibility
    attributes:
      label: Visibilidade do Repositório
      description: O repositório será interno ou privado?
      options:
        - Private
        - Internal
    validations:
      required: true

  - type: input
    id: team
    attributes:
      label: Time/Squad
      description: Nome do time ou squad responsável
      placeholder: ex. Platform Team
    validations:
      required: false

  - type: textarea
    id: additional_notes
    attributes:
      label: Notas Adicionais
      description: Informações adicionais ou requisitos específicos
      placeholder: |
        Exemplo:
        - Compliance requirements
        - Networking específico
        - Integrações necessárias
    validations:
      required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmação
      description: Ao submeter, você confirma que
      options:
        - label: Li e concordo com as políticas de criação de repositórios
          required: true
        - label: Tenho permissão para criar este repositório
          required: true
