name: 🚀 Novo Repositório - Aplicação
description: Criar repositório para aplicação (API, Frontend, Backend, etc)
title: "[NEW APP] - "
labels: ["new-repository", "automation", "application"]

body:
  - type: markdown
    attributes:
      value: |
        ## 🎯 Solicitação de Novo Repositório - Aplicação
        
        Preencha os campos abaixo para gerar automaticamente um repositório de aplicação com as configurações desejadas.

        ---

        ### 📝 **ATENÇÃO - Nome do Repositório**
        
        ⚠️ Informe **APENAS** o nome do `sistema-modulo` (sem prefixos).
        
        🔹 **O nome final será automaticamente gerado como:**  
        `a5x-app-<dominio>-<repo_name>`
        
        ⚠️ **IMPORTANTE:** Use **APENAS hífens (-)** para separar palavras.  
        ❌ **NÃO use underscores (_)** ou espaços!
        
        💡 **Exemplo:**
        - ❌ **Errado:** `anteros_receiver_financial` ou `anteros receiver financial`
        - ✅ **Correto:** `anteros-receiver-financial`
        - ✅ **Será criado:** `a5x-app-pos-anteros-receiver-financial`
        
        ---

        **⚠️ Importante:** Após submeter esta issue, o repositório será criado automaticamente em até 5 minutos.

  - type: input
    id: repo_name
    attributes:
      label: Nome do Repositório
      description: Nome do repositório a ser criado (sem espaços, use hífens). O nome final é composto por a5x-app-<dominio>-<repo_name>
      placeholder: ex. anteros-receiver-financial
    validations:
      required: true

  - type: input
    id: repo_description
    attributes:
      label: Descrição
      description: Breve descrição do repositório
      placeholder: ex. Engine responsável por processar todos os lançamentos financeiros, sejam eles originados pelo sistema de Clearing/Risco (LSEG) ou por outros sistemas satélites.
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domínio da Aplicação
      description: Qual domínio da aplicação será gerenciado?
      options:
        - CRX - Cross
        - DAT - Dados
        - POS - Post Trading
        - TRD - Trading
    validations:
      required: true

  - type: dropdown
    id: stack
    attributes:
      label: Stack Tecnológica
      description: Qual stack/linguagem será utilizada?
      options:
        - Java 17
        - Node.js 24.12.0
    validations:
      required: true

  - type: dropdown
    id: deployment_target
    attributes:
      label: Ambiente de Deploy
      description: Onde a aplicação será deployada?
      options:
        - AWS ECS (Container)
        - AWS EKS (Kubernetes)
        - AWS Lambda (Serverless)
        - On Premise
    validations:
      required: true

  - type: dropdown
    id: visibility
    attributes:
      label: Visibilidade do Repositório
      description: O repositório será interno ou privado?
      options:
        - Private
        - Internal
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmação
      description: Ao submeter, você confirma que
      options:
        - label: Li e concordo com as políticas de criação de repositórios
          required: true
